<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
  </head>

  <body>
    <div class="whole-div">
      <form
        action="#resultsTable"
        onsubmit="handleSubmit(event)"
        id="student-form"
      >
        <h1>Student Record Form</h1>
        <hr />

        <div class="inputs-div">
          <input type="hidden" id="student-id" name="id" />

          <div>
            <label class="required">First Name</label><br />
            <input type="text" placeholder="first name" id="firstNameId" />
            <br />
            <small id="firstNameError"></small>
          </div>

          <div>
            <label>Last Name</label><br />
            <input type="text" placeholder="last name" id="lastNameId" />
            <br />
            <small id="lastNameError"></small>
          </div>

          <div>
            <label class="required">Date of Birth</label> <br />
            <input type="date" id="dobId" />
            <br />
            <small id="dobError"></small>
          </div>

          <div>
            <label class="required">Admission Date</label> <br />
            <input type="date" id="admissionId" />
            <br />
            <small id="admissionError"></small>
          </div>

          <div>
            <label class="required">Phone</label> <br />

            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]{10}"
              maxlength="10"
              placeholder="Enter mobile number"
              id="phoneId"
            />

            <br />
            <small id="phoneError"></small>
          </div>

          <div>
            <label class="required">email</label> <br />
            <input type="email" id="emailId" />
            <br />
            <small id="emailError"></small>
          </div>

          <div class="address-div">
            <label class="required">Address</label>
            <textarea type="text" id="addressId" rows="5"></textarea>
            <small id="addressError"></small>
          </div>
        </div>
        <br />

        <div class="inputs-div">
          <div>
            <input type="submit" id="submitId" value="Submit" />
          </div>
        </div>
      </form>
      <br /><br />

      <!-- <div class="input-group"> -->
      <div class="search-div">
        <input
          type="search"
          placeholder="Search Data..."
          oninput="searchTable()"
        />
        <!-- <img src="images/search.png" alt="" /> -->
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>

      <div class="tableMainClass">
        <table class="tableClass" id="resultsTable">
          <thead>
            <tr class="rowClass">
              <th>First Name <span class="icon-arrow">&UpArrow;</span></th>
              <th>Last Name <span class="icon-arrow">&UpArrow;</span></th>
              <th>Date of Birth <span class="icon-arrow">&UpArrow;</span></th>
              <th>Admission Date <span class="icon-arrow">&UpArrow;</span></th>
              <th>Phone <span class="icon-arrow">&UpArrow;</span></th>
              <th>Email <span class="icon-arrow">&UpArrow;</span></th>
              <th>Address <span class="icon-arrow">&UpArrow;</span></th>
              <th>Update</th>
              <th>Delete</th>
            </tr>
          </thead>

          <tbody id="showStudentsId"></tbody>
        </table>
      </div>
      <br /><br /><br />
    </div>
    <br /><br /><br />
  </body>
  <script src="script.js"></script>
</html>
